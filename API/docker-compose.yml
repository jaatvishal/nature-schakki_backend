
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
     ACCEPT_EULA: "Y"
     MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
     - redis_data:/data
 
volumes:
 sql-data:
 redis-data: