<header class="shadow-md p-3 w-full max-h-20 fixed top-0 z-50 bg-white">
  <div class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto gap-4">
    @if (isEnabled('logo')) {
      <app-header-logo />
    }

    @if (isEnabled('nav')) {
      <app-header-nav />
    }

    <div class="flex items-center gap-3 ml-auto">
      @if (isEnabled('search')) {
        <app-header-search />
      }
      @if (isEnabled('cart')) {
        <app-header-cart-summary (openDrawer)="openCartDrawer()" />
      }
      @if (isEnabled('user-menu')) {
        <app-header-user-menu />
      }
    </div>
  </div>
</header>

@if (busyService.loading) {
  <mat-progress-bar mode="indeterminate" class="fixed top-20 z-50 w-full"></mat-progress-bar>
}

<app-cart-drawer [opened]="cartDrawerOpen()" (closed)="closeCartDrawer()" />
