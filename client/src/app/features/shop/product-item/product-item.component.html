@if (product) {
  <mat-card appearance="raised" routerLink="/shop/{{ product.id }}" class="product-card">
    <img [src]="product.pictureUrl" class="rounded-t-lg" alt="image of {{ product.name }}" />
    <mat-card-content>
      <h2 class="text-sm font-semibold uppercase">{{ product.name }}</h2>
      <p class="font-light">{{ product.price | currency: 'INR' }}</p>
    </mat-card-content>
    <mat-card-actions class="flex gap-1">
      <button mat-stroked-button class="flex-1" (click)="addToCart($event)">
        <mat-icon>add_shopping_cart</mat-icon>
        Add to cart
      </button>
      <button mat-icon-button (click)="toggleWishlist($event)" [attr.aria-label]="isInWishlist() ? 'Remove from wishlist' : 'Add to wishlist'">
        <mat-icon>{{ isInWishlist() ? 'favorite' : 'favorite_border' }}</mat-icon>
      </button>
    </mat-card-actions>
  </mat-card>
}
