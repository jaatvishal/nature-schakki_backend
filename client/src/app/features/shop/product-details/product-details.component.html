@if (product) {
  <section class="py-6">
    <div class="max-w-screen-xl mx-auto px-4">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
        <div class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl p-8 flex items-center justify-center shadow-inner">
          <img [src]="product.pictureUrl" [alt]="product.name" class="max-h-[28rem] object-contain drop-shadow-lg" />
        </div>
        <div class="flex flex-col">
          <span class="text-amber-700 text-sm font-bold uppercase tracking-widest">{{ product.brand }}</span>
          <h1 class="text-3xl font-bold text-gray-900 mt-2">{{ product.name }}</h1>
          <div class="flex gap-2 mt-4">
            <mat-chip>{{ product.type }}</mat-chip>
            <mat-chip [class]="product.quantityInStock > 0 ? '!bg-green-100' : '!bg-red-100'">
              {{ product.quantityInStock > 0 ? 'In Stock' : 'Out of Stock' }}
            </mat-chip>
          </div>

          <div class="mt-8 p-5 bg-gray-50 rounded-xl border">
            <div class="flex justify-between items-center text-sm text-gray-500">
              <span>Unit price</span>
              <span>{{ product.price | currency: 'INR' }}</span>
            </div>
            <div class="flex justify-between items-center mt-3">
              <div class="flex items-center gap-3">
                <span class="text-sm font-medium">Quantity</span>
                <mat-form-field appearance="outline" class="w-24 !mb-0">
                  <input matInput type="number" min="1" [max]="product.quantityInStock" [(ngModel)]="quantity" />
                </mat-form-field>
              </div>
              <div class="text-right">
                <p class="text-xs text-gray-500">Total</p>
                <p class="text-3xl font-extrabold text-amber-700">{{ totalPrice | currency: 'INR' }}</p>
              </div>
            </div>
          </div>

          <button mat-flat-button color="primary" class="!h-14 !text-lg mt-6" (click)="addToCart()"
            [disabled]="product.quantityInStock < 1">
            <mat-icon>shopping_cart</mat-icon>
            Add to Cart
          </button>

          <p class="text-gray-600 mt-6 leading-relaxed">{{ product.description }}</p>
        </div>
      </div>
    </div>
  </section>
}
