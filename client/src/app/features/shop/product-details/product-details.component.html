@if (product) {
  <section class="py-8">
    <div class="max-w-screen-2xl px-4 mx-auto">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="max-w-xl mx-auto">
          <img [src]="product.pictureUrl" alt="product image" class="w-full rounded-lg" />
        </div>
        <div>
          <h1 class="text-2xl font-semibold text-gray-900">{{ product.name }}</h1>
          <div class="mt-4 items-center gap-4 flex">
            <p class="text-3xl font-extrabold text-gray-900">
              {{ product.price | currency: 'INR' }}
            </p>
          </div>
          <div class="flex flex-wrap gap-4 mt-3 items-end">
            <button mat-stroked-button class="match-input-height" (click)="addToCart()">
              <mat-icon>shopping_cart</mat-icon>
              Add to cart
            </button>
            <button mat-stroked-button (click)="toggleWishlist()">
              <mat-icon>{{ isInWishlist() ? 'favorite' : 'favorite_border' }}</mat-icon>
              Wishlist
            </button>
            <mat-form-field appearance="outline" class="w-24">
              <mat-label>Quantity</mat-label>
              <input matInput type="number" min="1" [(ngModel)]="quantity" />
            </mat-form-field>
          </div>

          <mat-divider></mat-divider>

          <p class="mt-6 text-gray-500">{{ product.description }}</p>
        </div>
      </div>
    </div>
  </section>
}
