@if (products) {
<div class="flex flex-col gap-5">
    <div class="flex flex-col xl:flex-row xl:items-center gap-4">
        <form #searchForm="ngForm" (ngSubmit)="onSearchChange()"
          class="relative w-full xl:max-w-xl order-1 xl:order-2">
          <mat-icon class="!absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">search</mat-icon>
          <input type="search"
            class="w-full h-12 pl-11 pr-24 text-sm text-gray-900 bg-white border border-gray-300 rounded-xl shadow-sm outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-100 transition"
            placeholder="Search flour, grains, brands..."
            aria-label="Search products"
            name="search"
            [(ngModel)]="shopParams.search"
            (ngModelChange)="onSearchInput($event)" />
          @if (shopParams.search) {
            <button type="button" (click)="clearSearch()"
              class="absolute right-12 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full text-gray-500 hover:bg-gray-100 flex items-center justify-center"
              aria-label="Clear product search">
              <mat-icon class="!text-lg">close</mat-icon>
            </button>
          }
          <button type="submit"
            class="absolute right-1 top-1/2 -translate-y-1/2 w-10 h-10 rounded-lg bg-amber-600 text-white hover:bg-amber-700 flex items-center justify-center transition"
            aria-label="Search products">
            <mat-icon>search</mat-icon>
          </button>
        </form>

        <mat-paginator class="order-3 xl:order-1 xl:flex-1"
             (page)="handlePageChange($event)"
             [length]="products.count"
             [pageSize]="shopParams.pageSize"
             [showFirstLastButtons]="true"
             [pageSizeOptions]="pageSizeOptions"
             [pageIndex]="shopParams.pageNumber - 1"
             aria-label="Select product page">
        </mat-paginator>

        <div class="flex gap-3 order-2 xl:order-3 xl:justify-end">
         <button class="match-input-height" mat-stroked-button (click)="openFilterDialog()">
            <mat-icon>filter_list</mat-icon>
            Filters
        </button>
        <button class="match-input-height" mat-stroked-button [matMenuTriggerFor]="sortMenu">
            <mat-icon>swap_vert</mat-icon>
            Sort
        </button>
        </div>
        
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
   @for (product of products.data; track product.id) {
       <app-product-item [product]="product"></app-product-item>  
   } @empty {
      <div class="sm:col-span-2 lg:col-span-3 xl:col-span-5 text-center py-16 text-gray-500">
        <mat-icon class="!text-5xl !w-12 !h-12 mb-2">search_off</mat-icon>
        <p>No products match “{{ shopParams.search }}”.</p>
        <button mat-stroked-button class="mt-3" (click)="clearSearch()">Clear Search</button>
      </div>
   }
</div>
</div>

<mat-menu #sortMenu="matMenu">
  <mat-selection-list [multiple]="false" (selectionChange)="onSortChange($event) ">
     @for (sort of sortOptions; track $index) 
     {
        <mat-list-option [value]="sort.value" [selected]="shopParams.sort === sort.value">
            {{sort.name}}
        </mat-list-option>
     }
  </mat-selection-list>
  </mat-menu>
}
