<div class="max-w-md mx-auto py-8">
  <h1 class="text-2xl font-bold mb-6">Login</h1>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="current-password" />
      <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())" tabindex="-1">
        <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>
    <div class="text-right -mt-2">
      <a routerLink="/auth/forgot-password" class="text-sm text-amber-700 hover:underline">Forgot password?</a>
    </div>
    <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid">Login</button>
  </form>
  <p class="mt-4 text-xs text-gray-500">Dev: customer@natureschakki.com / Customer@123!</p>
  <p class="mt-4 text-sm text-gray-600">
    Don't have an account? <a routerLink="/auth/register" class="text-amber-700 hover:underline">Register</a>
  </p>
</div>
