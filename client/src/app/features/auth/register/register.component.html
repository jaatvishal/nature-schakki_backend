<div class="max-w-md mx-auto py-8">
  @if (!awaitingVerification()) {
    <h1 class="text-2xl font-bold mb-6">Create Account</h1>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <div class="grid grid-cols-2 gap-4">
      <mat-form-field appearance="outline">
        <mat-label>First Name</mat-label>
        <input matInput formControlName="firstName" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lastName" />
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" />
    </mat-form-field>
      <button mat-flat-button color="primary" type="submit" [disabled]="registerForm.invalid">Register</button>
    </form>
    <p class="mt-4 text-sm text-gray-600">
      Already have an account?
      <a routerLink="/auth/login" class="text-blue-600 hover:underline">Login</a>
    </p>
  } @else {
    <h1 class="text-2xl font-bold mb-2">Verify your email</h1>
    <p class="text-sm text-gray-600 mb-6">
      Enter the 6-digit code sent to {{ registeredEmail() }}.
    </p>
    <form [formGroup]="verificationForm" (ngSubmit)="verify()" class="flex flex-col gap-4">
      <mat-form-field appearance="outline">
        <mat-label>Verification code</mat-label>
        <input matInput inputmode="numeric" maxlength="6" autocomplete="one-time-code" formControlName="otp" />
      </mat-form-field>
      <button mat-flat-button color="primary" type="submit" [disabled]="verificationForm.invalid">
        Verify account
      </button>
      <button mat-stroked-button type="button" (click)="resend()">Resend code</button>
    </form>
  }
</div>
