

<div class="container mt-5 p-4 bg-gray-100 rounded-lg">
   <h1 class="text-3xl font-semibold mb-4">Internal server error</h1>
   @if(error){ 
      <h5 class="text-red-600">Error: {{error.message}}</h5>
      <p class="font-bold mb-2">This error comes from the server ,not angular</p>
      <p class="mb-2">What to do next?</p>
      <ol class="list-decimal ml-5 mb-4"> 
         <li class="mb-1">Check the console for more details</li>
         <li>Reproduce the error in postman</li>
         <li>Contact support if the issue persists</li>
      </ol>
      <h5 class="text-lg font-semibold mb-2"> Stack Trace</h5>
      <mat-card class="p-4 bg-white">
          <code class="block whitespace-pre-wrap">{{error.details}}</code>
      </mat-card>
   }
</div>
